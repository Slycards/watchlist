<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Watchlist</title>
<style>
  :root {
    --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --line:#e3e7ee;
    --accent:#2f6fd8; --accentDim:#dbe6f9;
    --text:#1c2536; --dim:#6b7789; --faint:#9aa3b2; --live:#1a9d6a;
    --gold:#b08628;
    --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sys); -webkit-font-smoothing:antialiased; }
  .mono { font-family:var(--sys); font-variant-numeric:tabular-nums; }
  .disp { font-family:var(--sys); font-weight:800; letter-spacing:-0.02em; }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:28px; margin:0; font-weight:800; letter-spacing:-0.02em; }
  input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
          padding:12px 96px 12px 14px; font-size:14px; border-radius:10px; outline:none; font-family:var(--sys);
          box-shadow:0 1px 2px rgba(28,37,54,0.04); }
  input::placeholder { color:var(--faint); }
  input:focus { border-color:var(--accent); }
  button { cursor:pointer; font-family:var(--sys); }
  .searchBtn { position:absolute; right:5px; top:5px; bottom:5px; padding:0 16px; background:var(--accent);
               color:#ffffff; border:none; border-radius:7px; font-weight:600; font-size:13px; }
  .rrow:hover { background:var(--panel2); }
  .tab { padding:8px 15px; font-size:13px; font-weight:600; border-radius:8px; border:1px solid var(--line);
         background:var(--panel); color:var(--dim); display:inline-flex; align-items:center; gap:7px; }
  .tab.on { border-color:var(--accent); background:#eaf1fc; color:var(--accent); }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }

  /* ---- list view mode ---- */
  .listgrid.catgrid { display:block; background:#fff; border-radius:12px;
    box-shadow:0 1px 3px rgba(28,37,54,0.05), 0 4px 14px rgba(28,37,54,0.05); }
  .list-header { display:grid; padding:9px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:var(--tabs-height, 54px); z-index:10; background:var(--panel);
    border-top-left-radius:12px; border-top-right-radius:12px; }
  .list-header .lh-cell { font-size:9px; color:var(--faint); letter-spacing:.06em; cursor:pointer;
    user-select:none; }
  .list-header .lh-cell:hover { color:var(--dim); }
  .list-header .lh-cell.active { color:var(--accent); }
  .prow.pcard { min-height:0; box-shadow:none; border-radius:0; padding:11px 16px;
    display:grid; align-items:center; border-bottom:1px solid var(--panel2); position:relative; cursor:grab; }
  .prow.pcard:last-child { border-bottom:none; }
  .prow.pcard.dragging { opacity:0.4; }
  .prow.pcard.touch-dragging { opacity:0.9; background:#fafbfc; box-shadow:0 4px 14px rgba(28,37,54,0.15); z-index:20; }
  .prow-expand-arrow { color:#8a95a5; font-size:13px; font-weight:700; cursor:pointer; transition:transform .15s ease; }
  .prow-expand-arrow.open { transform:rotate(90deg); color:var(--accent); }
  .prow-sub { background:#fafbfc; padding:8px 16px 12px 44px; border-bottom:1px solid var(--panel2); }
  .view-toggle-btn { font-size:11px; font-weight:600; color:var(--dim); background:none; border:1px solid var(--line);
    padding:5px 10px; border-radius:7px; cursor:pointer; }
  .view-toggle-btn:hover { background:var(--panel2); }
  .view-toggle-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pcard { background:var(--panel); border:1px solid transparent; border-radius:12px; padding:16px 16px 18px;
           position:relative; transition:opacity .2s, box-shadow .18s; cursor:grab; min-height:260px;
           box-shadow:0 1px 3px rgba(28,37,54,0.05), 0 4px 14px rgba(28,37,54,0.05); }
  .pcard:active { cursor:grabbing; }
  .pcard.dragging { opacity:0.4; }
  .pcard.touch-dragging { opacity:0.85; transform:scale(1.03); box-shadow:0 8px 24px rgba(28,37,54,0.25); z-index:20; transition:box-shadow .15s, transform .15s; }
  .pcard.prev { opacity:0.55; }
  .pcard.drop-before::before, .pcard.drop-after::after {
    content:""; position:absolute; top:6px; bottom:6px; width:2px; border-radius:2px;
    background:var(--accent); box-shadow:0 0 5px rgba(47,111,216,0.35);
  }
  .pcard.drop-before::before { left:-8px; }
  .pcard.drop-after::after { right:-8px; }
  .pcard:hover { box-shadow:0 2px 6px rgba(28,37,54,0.08), 0 8px 22px rgba(28,37,54,0.07); }
  .x { position:absolute; top:12px; right:12px; background:none; border:none; color:var(--faint); font-size:18px; line-height:1; }
  .pmove-btn { position:absolute; top:10px; right:36px; background:none; border:none; color:var(--faint); font-size:15px;
    line-height:1; padding:3px 6px; border-radius:6px; cursor:pointer; }
  .pmove-btn:hover { background:var(--panel2); color:var(--dim); }
  .pmove-dropdown .catmenu-item { padding:12px 14px; font-size:13px; }
  .pmove-back { padding:10px 14px; font-size:11px; color:var(--faint); cursor:pointer; border-bottom:1px solid var(--panel2); display:flex; align-items:center; gap:5px; }
  .pmove-back:hover { background:var(--panel2); }
  .pmove-check { color:var(--accent); font-weight:700; }
  #globalToast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff;
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:8px; box-shadow:0 6px 20px rgba(28,37,54,0.25);
    z-index:100; opacity:0; transition:opacity .2s ease; pointer-events:none; white-space:nowrap; }
  .tag { font-size:9px; font-weight:700; letter-spacing:0.06em; border-radius:4px; padding:2px 6px; }
  .tag-live { color:#ffffff; background:var(--live); }
  .tag-final { color:#ffffff; background:#6b8fc7; }
  .tag-prev { color:var(--dim); background:var(--panel2); }
  .tag-sched { color:var(--dim); background:var(--panel2); }
  .stat { text-align:center; }
  .stat .v { font-weight:800; line-height:1.1; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:8.5px; letter-spacing:0.12em; color:var(--faint); margin-top:3px; text-transform:uppercase; }
  .row { display:flex; justify-content:space-evenly; }
  .divider { width:1px; background:var(--line); }
  @keyframes livepulse { 0%{ box-shadow:0 0 0 0 rgba(26,157,106,0.45);} 70%{ box-shadow:0 0 0 6px rgba(26,157,106,0);} 100%{ box-shadow:0 0 0 0 rgba(26,157,106,0);} }
  .livedot { animation: livepulse 1.6s infinite; }

  /* ---- categories ---- */
  .category-section { margin-bottom:26px; }
  .cat-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .cat-count { font-size:10px; color:var(--faint); background:var(--panel2); border-radius:10px; padding:1px 8px; }
  .cat-actions { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .cat-action-wrap { position:relative; }
  .cat-edit-btn { background:none; border:none; color:#9ea6b2; font-size:12px; font-weight:600; padding:4px 6px;
    border-radius:6px; cursor:pointer; }
  .cat-edit-btn:hover { background:var(--panel2); color:#6b727e; }
  .cat-sort-btn { background:none; border:none; color:#9ea6b2; font-size:12px; font-weight:600; padding:4px 6px;
    border-radius:6px; cursor:pointer; }
  .cat-sort-btn:hover { background:var(--panel2); color:#6b727e; }
  .cat-sort-btn.disabled { opacity:0.4; cursor:default; pointer-events:none; }
  .catmenu-dropdown { position:absolute; top:calc(100% + 4px); right:0; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; box-shadow:0 6px 20px rgba(28,37,54,0.14); z-index:30; overflow:hidden; min-width:140px; }
  .catmenu-item { padding:9px 13px; font-size:12.5px; cursor:pointer; color:var(--text); }
  .catmenu-item:hover { background:var(--panel2); }
  .catmenu-item.danger { color:#c24444; }
  .catmenu-item.disabled { color:var(--faint); cursor:default; pointer-events:none; }
  .catmenu-divider { height:1px; background:var(--line); margin:4px 0; }
  .category-section.cat-droptarget .catgrid { background:#e4ecfb; border-radius:12px; outline:1.5px dashed var(--accent); outline-offset:6px; }
  .empty-cat-hint { grid-column:1/-1; border:1.5px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--faint); font-size:12px; }
  .category-section { border-radius:12px; }
  .addcat-chip { background:var(--panel); border:1.5px dashed var(--line); border-radius:10px; padding:9px 16px;
    color:var(--faint); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .addcat-chip:hover { border-color:var(--accent); color:var(--accent); }
  #newCatInput { max-width:220px; display:inline-block; }

  #tabs { position: sticky; top: 0; z-index: 15; background: var(--bg); padding: 10px 0; transition: box-shadow .15s, border-color .15s; border-bottom: 1px solid transparent; }
  #tabs.scrolled { box-shadow: 0 3px 10px rgba(28,37,54,0.07); border-bottom-color: var(--line); }
  #refreshWrap { margin-left:auto; display:flex; align-items:center; gap:7px; }
  #refreshTime { font-size:10px; color:var(--faint); font-family:var(--sys); white-space:nowrap; }
  #refreshBtn { background:none; border:none; cursor:pointer; font-size:13px; opacity:.5; padding:2px; line-height:1;
    transition:opacity .15s ease; }
  #refreshBtn:hover { opacity:.85; }
  #refreshBtn.spinning { animation: refreshSpin .7s linear; }
  @keyframes refreshSpin { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  #fabWrap { position: fixed; bottom: 22px; right: 22px; z-index: 30; }
  #fabBtn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; border: none;
    font-size: 24px; line-height: 1; box-shadow: 0 3px 12px rgba(28,37,54,0.22); }
  #fabBtn:hover { background: #2a63c7; }
  #fabPanel { display:none; position:absolute; bottom:64px; right:0; width:280px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 26px rgba(28,37,54,0.2); padding:12px; }

  /* ---- sync-code onboarding overlay ---- */
  #syncOverlay { position:fixed; inset:0; background:rgba(28,37,54,0.45); z-index:200; display:none;
    align-items:center; justify-content:center; padding:20px; }
  #syncOverlay.show { display:flex; }
  #syncCard { background:var(--panel); border-radius:14px; padding:28px; box-shadow:0 4px 20px rgba(28,37,54,0.1);
    max-width:420px; width:100%; font-family:var(--sys); position:relative; }
  #syncCard h2 { font-weight:800; font-size:19px; color:var(--text); margin:0 0 6px; }
  #syncCard p { font-size:12.5px; color:var(--dim); margin:0 0 18px; line-height:1.5; }
  .sync-btn-primary { background:var(--accent); color:#fff; text-align:center; padding:11px; border-radius:8px;
    font-size:13px; font-weight:700; border:none; width:100%; cursor:pointer; }
  .sync-btn-secondary { text-align:center; padding:11px; border-radius:8px; font-size:13px; font-weight:600;
    color:var(--dim); border:1px solid var(--line); background:none; width:100%; cursor:pointer; }
  .sync-subtext { text-align:center; font-size:10.5px; color:var(--faint); margin:4px 0 14px; }
  .sync-code-box { background:var(--panel2); border:1.5px dashed var(--line); border-radius:9px; padding:16px;
    text-align:center; font-family:var(--sys); font-size:15px; font-weight:700; color:var(--text);
    letter-spacing:0.02em; margin-bottom:14px; word-break:break-all; }
  .sync-warning { background:#fbe9e9; border-radius:8px; padding:10px 12px; font-size:11.5px; color:#a03d3d;
    margin-bottom:16px; line-height:1.5; }
  .sync-input { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; font-size:13px; font-family:var(--sys); margin-bottom:12px; color:var(--text); }
  .sync-link-row { text-align:center; font-size:11.5px; color:var(--faint); }
  .sync-link-row a { color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer; }
  #syncBadge { font-size:10px; color:var(--faint); background:var(--panel2); border-radius:20px; padding:3px 9px;
    cursor:pointer; font-family:var(--sys); }
  #syncOpenBtn { font-size:11px; font-weight:600; color:var(--dim); background:none; border:none; padding:4px 7px;
    border-radius:6px; cursor:pointer; }
  #syncOpenBtn:hover { background:var(--panel2); color:var(--text); }
  #syncCloseX { position:absolute; top:14px; right:14px; background:none; border:none; color:var(--faint);
    font-size:18px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:6px; }
  #syncCloseX:hover { background:var(--panel2); color:var(--dim); }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } .livedot{ animation:none !important; } }
</style>
</head>
<body>
<div id="syncOverlay"><div id="syncCard"></div></div>
<div class="wrap">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <h1 class="disp">THE WATCHLIST</h1>
    </div>
    <span class="mono" id="statusLine" style="color:var(--faint);font-size:12px;display:inline-flex;align-items:center;gap:6px;">
      <span id="statusDot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:#9aa3b2;flex-shrink:0;" title="Connection status"></span>
      <span id="statusText">MLB Stats API</span>
    </span>
    <span id="syncBadge" style="display:none;" title="Click to sign out"></span>
    <button id="syncOpenBtn" class="mono">Sync to Another Device</button>
  </div>

  <div style="position:relative;margin-bottom:22px;max-width:460px;">
    <input id="search" placeholder="Add a hitter — e.g. Junior Caminero" autocomplete="off" />
    <button class="searchBtn" id="searchBtn">Search</button>
    <div id="results" style="position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:20;overflow:hidden;display:none;box-shadow:0 4px 20px rgba(28,37,54,0.1);"></div>
  </div>

  <div id="tabs" style="display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;"></div>

  <div id="viewToggle" style="display:flex;gap:6px;margin-bottom:18px;">
    <button class="view-toggle-btn active" id="viewCardsBtn">Cards</button>
    <button class="view-toggle-btn" id="viewListBtn">List</button>
  </div>

  <div id="empty" style="border:1px dashed var(--line);border-radius:12px;padding:48px 24px;text-align:center;color:var(--dim);">
    <div class="disp" style="font-size:18px;color:var(--text);margin-bottom:6px;">No players yet.</div>
    <div style="font-size:13px;">Search a name to start your watchlist. Try Caminero, James Wood, or Nick Kurtz.</div>
  </div>

  <div id="cards"></div>
  <div id="addCatRow" style="margin-top:6px;"></div>
</div>

<div id="fabWrap">
  <div id="fabPanel">
    <div style="position:relative;">
      <input id="fabSearch" placeholder="Add a hitter…" autocomplete="off" />
      <div id="fabResults" style="position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:20;overflow:hidden;display:none;box-shadow:0 4px 20px rgba(28,37,54,0.1);"></div>
    </div>
  </div>
  <button id="fabBtn" aria-label="Add a hitter">+</button>
</div>

<script>
const WINDOWS = [
  { key:"live", label:"Today" }, { key:"d7", label:"7 Games" }, { key:"d15", label:"15 Games" },
  { key:"d30", label:"30 Games" }, { key:"season", label:"Season" },
];
const POLL_MS = 25000;
const LS_KEY_OLD = "sly_watchlist_ids";       // legacy key, migrated on first load
const LS_PLAYERS = "sly_watchlist_players_v2"; // [{id, categoryId}]
const LS_CATS = "sly_watchlist_categories_v2"; // [{id, name}]
const UNCAT = "__uncat__";

let win = "season";
let players = [];            // {id,name,team,pos,categoryId}
let categories = [];         // {id,name}
let dataById = {};           // id -> {season,splits}
let liveById = {};           // id -> live line
let pollTimer = null;
let dragPid = null;
let lastUpdated = null;      // ms timestamp of the last successful full data fetch
let refreshing = false;
let apiStatus = null; // null (unknown/loading) | "ok" | "error"
let viewMode = "cards"; // "cards" | "list" — Today tab stays cards-only regardless
let expandedRows = new Set(); // player ids with their secondary stats expanded, in list mode

// Colors the status dot green when the last batch of MLB Stats API calls
// succeeded, red when any of them failed — a real connectivity signal
// instead of a static "live" label that never actually reflected anything.
function setApiStatus(ok){
  apiStatus = ok ? "ok" : "error";
  const dot = document.getElementById("statusDot");
  if(dot) dot.style.background = ok ? "#1a9d6a" : "#c24444";
}

// ---------------------------------------------------------------------------
// Sync code — lets a watchlist follow you across devices. Entirely optional:
// if you never touch it, the app works exactly as it always has, saving only
// to this browser's local storage. Only once a code exists does it also push
// to the server, so nothing about existing local-only usage changes.
// ---------------------------------------------------------------------------
const SYNC_CODE_KEY = "sly_sync_code";
let syncCode = null;
try{ syncCode = localStorage.getItem(SYNC_CODE_KEY) || null; }catch(e){}
updateSyncBadge(); // set the correct button/badge state immediately, before the async boot below runs

function setSyncCode(code){
  syncCode = code;
  try{ localStorage.setItem(SYNC_CODE_KEY, code); }catch(e){}
  updateSyncBadge();
}
function clearSyncCode(){
  syncCode = null;
  try{ localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
  updateSyncBadge();
}
function updateSyncBadge(){
  const badge = document.getElementById("syncBadge");
  const openBtn = document.getElementById("syncOpenBtn");
  if(!badge || !openBtn) return;
  if(syncCode){
    badge.style.display = "inline-block"; badge.textContent = "●●●●" + syncCode.slice(-4);
    openBtn.style.display = "none";
  } else {
    badge.style.display = "none";
    openBtn.style.display = "inline-block";
  }
}

async function generateSyncCode(){
  const res = await fetch("/api/account", { method:"POST" });
  if(!res.ok) throw new Error("couldn't create a code");
  return (await res.json()).code;
}
async function loadFromServerByCode(code){
  const res = await fetch(`/api/account/${encodeURIComponent(code)}`);
  if(res.status===404) return { notFound:true };
  if(!res.ok) throw new Error("server error");
  return { data: await res.json() };
}
let saveToServerTimer = null;
function scheduleServerSave(){
  if(!syncCode) return;
  clearTimeout(saveToServerTimer);
  saveToServerTimer = setTimeout(saveToServer, 800); // batches rapid changes into one call
}
async function saveToServer(){
  if(!syncCode) return;
  try{
    await fetch(`/api/account/${encodeURIComponent(syncCode)}`, {
      method:"PUT",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ categories, players: players.map(p=>({id:p.id, categoryId:p.categoryId||null})) }),
    });
  }catch(e){ /* offline/server issue — local copy is safe, next change retries */ }
}

// Replaces current app state with data loaded from a sync code — used both
// when someone enters an existing code and when the app boots already synced.
async function applyLoadedData(data){
  categories = data.categories || [];
  players = [];
  render();
  for(const rec of (data.players || [])){
    try{
      const prof = await api(`/api/profile/${rec.id}`);
      prof.categoryId = rec.categoryId || null;
      players.push(prof);
    }catch(e){ players.push({ id:rec.id, name:"#"+rec.id, team:"", pos:"", categoryId:rec.categoryId||null }); }
  }
  saveState();
  render();
  let anyFailed=false;
  for(const p of players){
    try{ dataById[p.id]=await api(`/api/player/${p.id}`); render(); }catch(e){ anyFailed=true; }
  }
  lastUpdated = Date.now();
  if(players.length) setApiStatus(!anyFailed);
  renderTabs();
}

function showSyncOverlay(view, data){ document.getElementById("syncOverlay").classList.add("show"); renderSyncScreen(view, data); }
function hideSyncOverlay(){ document.getElementById("syncOverlay").classList.remove("show"); }

function renderSyncScreen(view, data={}){
  const card = document.getElementById("syncCard");
  const closeX = `<button id="syncCloseX" aria-label="Close">×</button>`;
  if(view==="welcome"){
    const hasLocal = players.length > 0;
    card.innerHTML = closeX + `
      <h2>Welcome to The Watchlist</h2>
      <p>${hasLocal
        ? `We found a watchlist already on this device — <strong style="color:var(--text);">${players.length} player${players.length===1?"":"s"}</strong> across ${categories.length} categor${categories.length===1?"y":"ies"}.`
        : `Get a code to sync your watchlist across your devices, or enter one you already have.`}</p>
      <button class="sync-btn-primary" id="syncGetCode">Get My Code</button>
      <div class="sync-subtext">syncs your watchlist to any device</div>
      <button class="sync-btn-secondary" id="syncHaveCode">I already have a code</button>`;
    document.getElementById("syncGetCode").onclick = handleGetCode;
    document.getElementById("syncHaveCode").onclick = ()=> renderSyncScreen("entry");
  } else if(view==="code-display"){
    card.innerHTML = closeX + `
      <h2>Here's your code</h2>
      <p>Use this on any other device to pull up this same watchlist:</p>
      <div class="sync-code-box">${esc(data.code)}</div>
      <div class="sync-warning">⚠ Save this somewhere safe — it's the only way to get this watchlist back on another device.</div>
      <button class="sync-btn-primary" id="syncContinue">Continue</button>`;
    document.getElementById("syncContinue").onclick = hideSyncOverlay;
  } else if(view==="entry"){
    card.innerHTML = closeX + `
      <h2>Welcome to The Watchlist</h2>
      <p>Enter your code to pull up your watchlist:</p>
      <input class="sync-input" id="syncCodeInput" placeholder="Paste your code here" autocomplete="off" />
      <div id="syncEntryError" style="display:none;color:#c24444;font-size:11.5px;margin:-6px 0 12px;"></div>
      <button class="sync-btn-primary" id="syncEntryContinue">Continue</button>
      <div class="sync-link-row" style="margin-top:12px;">Don't have a code? <a id="syncEntryGetOne">Get one</a></div>`;
    document.getElementById("syncEntryContinue").onclick = handleEnterCode;
    document.getElementById("syncEntryGetOne").onclick = ()=> renderSyncScreen("welcome");
  }
  document.getElementById("syncCloseX").onclick = hideSyncOverlay;
}

async function handleGetCode(){
  const btn = document.getElementById("syncGetCode");
  btn.textContent = "Creating…"; btn.disabled = true;
  try{
    const code = await generateSyncCode();
    setSyncCode(code);
    await saveToServer(); // upload whatever's currently local right now
    renderSyncScreen("code-display", { code });
  }catch(e){
    btn.textContent = "Get My Code"; btn.disabled = false;
    alert("Couldn't create a code right now — check your connection and try again.");
  }
}
async function handleEnterCode(){
  const input = document.getElementById("syncCodeInput");
  const code = input.value.trim();
  const errEl = document.getElementById("syncEntryError");
  errEl.style.display = "none";
  if(!code) return;
  const btn = document.getElementById("syncEntryContinue");
  btn.textContent = "Loading…"; btn.disabled = true;
  try{
    const result = await loadFromServerByCode(code);
    if(result.notFound){
      errEl.textContent = "That code wasn't found — double check it and try again.";
      errEl.style.display = "block";
      btn.textContent = "Continue"; btn.disabled = false;
      return;
    }
    setSyncCode(code);
    await applyLoadedData(result.data);
    hideSyncOverlay();
  }catch(e){
    errEl.textContent = "Couldn't connect — check your connection and try again.";
    errEl.style.display = "block";
    btn.textContent = "Continue"; btn.disabled = false;
  }
}

const fmt3 = (n) => (n==null||isNaN(n)?"—":Number(n).toFixed(3).replace(/^0/,""));
const pct  = (n) => (n==null||isNaN(n)?"—":Number(n).toFixed(1)+"%");
const mph  = (n) => (n==null||isNaN(n)?"—":Number(n).toFixed(1));

// ---- persistence ----
function saveState(){
  try{
    localStorage.setItem(LS_PLAYERS, JSON.stringify(players.map(p=>({id:p.id, categoryId:p.categoryId||null}))));
    localStorage.setItem(LS_CATS, JSON.stringify(categories));
  }catch(e){}
  scheduleServerSave();
}

async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

// ---- search ----
function wireSearchBox(inputEl, resultsEl, btnEl, onAdded){
  let timer = null;
  let seq = 0; // bumped on every call — lets us detect and discard stale responses
  function showOne(p){
    resultsEl.innerHTML = `
      <div class="rrow" data-id="${p.id}" data-name="${esc(p.name)}" data-team="${esc(p.team)}" data-pos="${esc(p.pos)}"
           style="padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);">
        <span style="font-size:14px;">${esc(p.name)}</span>
        <span class="mono" style="font-size:12px;color:var(--dim);">${esc(p.pos)} · ${esc(p.team||"FA")}</span>
      </div>`;
    resultsEl.style.display="block";
    resultsEl.querySelector(".rrow").onclick=()=>{
      addPlayer({ id:p.id, name:p.name, team:p.team, pos:p.pos }, inputEl, resultsEl);
      if(onAdded) onAdded();
    };
  }
  async function run(q){
    q=q.trim();
    const mySeq = ++seq;
    if(!q){ resultsEl.style.display="none"; return; }
    try{
      // A raw numeric MLBAM ID (found via web search when a name search fails
      // — e.g. a player known mainly by nickname, or with an accented surname
      // MLB's search won't literal-match) always works, since it skips name
      // matching entirely and looks the player up directly.
      if(/^\d+$/.test(q)){
        const p = await api(`/api/profile/${q}`);
        if(mySeq !== seq) return;
        showOne(p);
        return;
      }
      const people = await api(`/api/search?q=${encodeURIComponent(q)}`);
      // A newer search may have started (and possibly already finished) while
      // this one was in flight — e.g. the fuller "Bryce Rainer" query needs an
      // extra retry round-trip, so a faster earlier "Bryce Ra" response can
      // arrive after it and overwrite correct results with stale ones. If a
      // later call has already begun, this response is stale — drop it.
      if(mySeq !== seq) return;
      if(!people.length){ resultsEl.style.display="none"; return; }
      // Show more than before (a last-name-only fallback for a common surname
      // — e.g. "Parker" — can return dozens of people; capping at 10 could
      // hide the one you actually want). The dropdown scrolls if it's long.
      resultsEl.style.maxHeight = "320px";
      resultsEl.style.overflowY = "auto";
      resultsEl.innerHTML = people.slice(0,30).map(p=>`
        <div class="rrow" data-id="${p.id}" data-name="${esc(p.name)}" data-team="${esc(p.team)}" data-pos="${esc(p.pos)}"
             style="padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);">
          <span style="font-size:14px;">${esc(p.name)}</span>
          <span class="mono" style="font-size:12px;color:var(--dim);">${esc(p.pos)} · ${esc(p.team||"FA")}</span>
        </div>`).join("");
      resultsEl.style.display="block";
      resultsEl.querySelectorAll(".rrow").forEach(el=>{
        el.onclick=()=>{
          addPlayer({ id:+el.dataset.id, name:el.dataset.name, team:el.dataset.team, pos:el.dataset.pos }, inputEl, resultsEl);
          if(onAdded) onAdded();
        };
      });
    }catch(e){ if(mySeq===seq) resultsEl.style.display="none"; }
  }
  inputEl.addEventListener("input", e=>{ clearTimeout(timer); timer=setTimeout(()=>run(e.target.value),300); });
  inputEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ clearTimeout(timer); run(e.target.value); }});
  if(btnEl) btnEl.onclick=()=>run(inputEl.value);
}
wireSearchBox(document.getElementById("search"), document.getElementById("results"), document.getElementById("searchBtn"));

async function addPlayer(p, inputEl, resultsEl){
  if(players.some(x=>x.id===p.id)) return;
  p.categoryId = null; // lands in Uncategorized until sorted
  players.push(p); saveState();
  if(resultsEl) resultsEl.style.display="none";
  if(inputEl) inputEl.value="";
  render();
  try{ dataById[p.id] = await api(`/api/player/${p.id}`); }catch(e){}
  if(win==="live") pollLive();
  render();
}
function removePlayer(id){
  players = players.filter(p=>p.id!==id);
  delete dataById[id]; delete liveById[id];
  saveState(); render();
}

// ---- live polling ----
async function pollLive(){
  if(!players.length){ return; }
  try{
    const ids = players.map(p=>p.id).join(",");
    liveById = await api(`/api/live?ids=${ids}`);
    setApiStatus(true);
    const st = document.getElementById("statusText");
    if(st) st.textContent = "updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){ setApiStatus(false); }
  if(win==="live") render();
}
function startPolling(){ stopPolling(); pollLive(); pollTimer=setInterval(pollLive,POLL_MS); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

// ---- tabs ----
function timeAgo(ms){
  if(!ms) return "";
  const diff = Date.now() - ms;
  const mins = Math.floor(diff/60000);
  if(mins<1) return "updated just now";
  if(mins<60) return `updated ${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs<24) return `updated ${hrs}h ago`;
  const days = Math.floor(hrs/24);
  return `updated ${days}d ago`;
}

function renderTabs(){
  const t=document.getElementById("tabs");
  const anyLive = Object.values(liveById).some(l=>l && l.state==="Live");
  t.innerHTML = WINDOWS.map(w=>`
    <button class="tab ${w.key===win?"on":""}" data-k="${w.key}">
      ${w.key==="live"?`<span class="${anyLive?"livedot":""}" style="width:7px;height:7px;border-radius:99px;display:inline-block;background:${anyLive?"var(--accent)":"var(--faint)"};"></span>`:""}
      ${w.label}
    </button>`).join("")
    + `<span id="refreshWrap">
         <span id="refreshTime">${esc(timeAgo(lastUpdated))}</span>
         <button id="refreshBtn" aria-label="Refresh data" title="Refresh data">🔄</button>
       </span>`;
  t.querySelectorAll(".tab").forEach(b=>{
    b.onclick=()=>{ win=b.dataset.k; if(win==="live") startPolling(); else stopPolling();
      if(win!=="live"){ const st=document.getElementById("statusText"); if(st) st.textContent="MLB Stats API"; }
      render(); };
  });
  const rb = document.getElementById("refreshBtn");
  if(rb) rb.onclick = refreshAllData;
  updateTabsHeightVar();
}

// The list header sticks right below the tabs bar — measured at runtime
// rather than hardcoded, since the tabs bar's real height can shift (e.g.
// wrapping to two lines on a narrow screen) and a guessed pixel value would
// drift out of sync and either overlap or leave a gap.
function updateTabsHeightVar(){
  const t = document.getElementById("tabs");
  if(t) document.documentElement.style.setProperty("--tabs-height", t.offsetHeight + "px");
}
window.addEventListener("resize", updateTabsHeightVar);

// Re-fetches season/splits data for every player currently on the watchlist,
// updates lastUpdated, and re-renders. This is the manual counterpart to the
// automatic refresh-on-return-to-tab behavior — use this any time you want
// current data without waiting or reloading the page.
async function refreshAllData(){
  if(refreshing) return;
  refreshing = true;
  const rb = document.getElementById("refreshBtn");
  if(rb){ rb.classList.remove("spinning"); void rb.offsetWidth; rb.classList.add("spinning"); }
  try{
    let anyFailed = false;
    await Promise.all(players.map(async (p)=>{
      try{ dataById[p.id] = await api(`/api/player/${p.id}`); }catch(e){ anyFailed = true; }
    }));
    if(win==="live") await pollLive();
    lastUpdated = Date.now();
    if(players.length) setApiStatus(!anyFailed);
  } finally {
    refreshing = false;
    render();
  }
}
// Keep the "updated Xm ago" text honest even with no other activity on screen.
setInterval(()=>{ const el=document.getElementById("refreshTime"); if(el) el.textContent = timeAgo(lastUpdated); }, 60000);

// Auto-refresh when you come back to this tab after it's been backgrounded —
// e.g. left it open for 5 hours, switched back. Only fires if the data is
// actually stale enough to matter (2+ minutes), so briefly glancing away and
// back doesn't trigger a pointless re-fetch.
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    const staleMs = lastUpdated ? Date.now() - lastUpdated : Infinity;
    if(staleMs > 2*60*1000) refreshAllData();
  }
});

// ---- stat + card rendering ----
function lineFor(p){
  const d=dataById[p.id]; if(!d) return null;
  if(win==="season") return d.season;
  if(win==="d7") return d.splits?.d7;
  if(win==="d15") return d.splits?.d15;
  if(win==="d30") return d.splits?.d30;
  return null;
}
// Team score chip for the Today tab — live games get a light blue tint with
// bright blue digits, final games get a neutral grey tint with muted
// slate-blue digits (deliberately not black, so it never competes with the
// player's own stat numbers just below it, which stay the boldest thing on
// the card). Team abbreviations are a lighter grey than the score itself so
// the two don't blend together.
function scoreChipHtml(score, active){
  if(!score) return "";
  const bg = active ? "#eaf1fc" : "var(--panel2)";
  const numColor = active ? "var(--accent)" : "#5a6b8c";
  const teamColor = "var(--dim)";
  return `<div style="display:inline-flex;align-items:center;background:${bg};border-radius:8px;padding:6px 10px;margin-bottom:12px;">
    <span style="font-size:12px;font-weight:700;color:${teamColor};">${esc(score.awayAbbr)}</span>
    <span style="font-weight:800;font-size:11px;color:${numColor};margin:0 6px;">${score.away}</span>
    <span style="width:1px;height:14px;background:var(--line);margin:0 4px;"></span>
    <span style="font-weight:800;font-size:11px;color:${numColor};margin:0 6px;">${score.home}</span>
    <span style="font-size:12px;font-weight:700;color:${teamColor};">${esc(score.homeAbbr)}</span>
  </div>`;
}
function statBlock(label,value,big,accent){
  return `<div class="stat"><div class="v" style="font-size:${big?22:15}px;color:${accent||"var(--text)"};">${value}</div><div class="l">${label}</div></div>`;
}

const HEAT_COLORS = {
  cold:    { fill:"#4a8fe0", text:"#2f6fd8" },
  cooling: { fill:"#a9c9f0", text:"#5c8fd9" },
  steady:  { fill:"#d8dde6", text:"#6b7789" },
  heating: { fill:"#f0c9a0", text:"#c2751f" },
  hot:     { fill:"#e0824a", text:"#b8461f" },
};
function heatGaugeHtml(heat, windowOps, seasonOps){
  const c = HEAT_COLORS[heat.key] || HEAT_COLORS.steady;
  // Visual range spans a bit past the band edge so extreme deltas don't sit
  // exactly on the boundary line.
  const range = heat.edge * 1.4;
  const pct = Math.max(0, Math.min(100, ((heat.delta + range) / (range*2)) * 100));
  const segs = ["#4a8fe0","#a9c9f0","#d8dde6","#f0c9a0","#e0824a"];
  return `<div style="margin-bottom:14px;">
    <div style="position:relative;margin-bottom:5px;">
      <div style="height:7px;border-radius:99px;overflow:hidden;display:flex;">
        ${segs.map(s=>`<div style="flex:1;background:${s};"></div>`).join("")}
      </div>
      <div style="position:absolute;top:50%;left:${pct}%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:${c.fill};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(28,37,54,0.3);"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:8px;color:var(--faint);letter-spacing:0.06em;margin-bottom:6px;">
      <span>COLD</span><span>HOT</span>
    </div>
    <div class="mono" style="font-size:11px;font-weight:700;color:${c.text};">${esc(heat.label)} · ${fmt3(windowOps)} OPS
      <span style="color:var(--faint);font-weight:400;">(season ${fmt3(seasonOps)})</span></div>
  </div>`;
}
function cardHtml(p){
  const d=dataById[p.id];
  let body="", isPrev=false;
  if(win==="live"){
    const live=liveById[p.id];
    if(live && live.state==="Preview"){
      body=`<div style="display:flex;align-items:center;gap:8px;">
        <span class="tag tag-sched">SCHED</span>
        <span class="mono" style="font-size:12px;color:var(--dim);">${esc(live.matchup||"")} · ${esc(live.time||"")}</span></div>`;
    } else if(live && (live.state==="Live" || live.state==="Final")){
      const active=live.state==="Live";
      const statusEl = active
        ? `<span class="livedot" style="width:7px;height:7px;border-radius:99px;background:var(--accent);display:inline-block;"></span>
           <span class="tag tag-live" style="margin-left:2px;">LIVE</span>
           <span class="mono" style="font-size:11px;color:var(--dim);">${esc(live.inning)} · ${esc(live.opp||live.matchup||"")}</span>`
        : `<span class="tag tag-final">FINAL</span>
           <span class="mono" style="font-size:11px;color:var(--dim);">${esc(live.opp||live.matchup||"")}</span>`;
      body=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">${statusEl}</div>
        ${scoreChipHtml(live.score, active)}
        <div class="row" style="padding:4px 2px;">
        ${statBlock("AB",live.line.ab)}${statBlock("R",live.line.r)}${statBlock("H",live.line.h)}
        ${statBlock("HR",live.line.hr)}${statBlock("RBI",live.line.rbi)}</div>
        ${live.summary?`<div class="mono" style="margin-top:12px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px;">${esc(live.summary)}</div>`:""}`;
    } else {
      const lg = d && d.lastGame;
      if(lg && lg.line){
        isPrev=true;
        body=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <span class="tag tag-prev">PREV</span>
          <span class="mono" style="font-size:11px;color:var(--dim);">${esc(fmtGameDate(lg.date))}${lg.opp?" · "+esc(lg.opp):""}</span></div>
          <div class="row" style="padding:4px 2px;">
          ${statBlock("AB",lg.line.ab)}${statBlock("R",lg.line.r)}${statBlock("H",lg.line.h)}
          ${statBlock("HR",lg.line.hr)}${statBlock("RBI",lg.line.rbi)}</div>`;
      } else {
        body=`<div style="color:var(--faint);font-size:13px;padding:8px 0;">No games yet.</div>`;
      }
    }
  } else {
    const line=lineFor(p);
    if(!d){ body=`<div style="color:var(--faint);font-size:13px;">Loading…</div>`; }
    else if(!line){ body=`<div style="color:var(--faint);font-size:13px;">No data for this window.</div>`; }
    else {
      const grey="var(--faint)";
      // Heat gauge only applies to the 7/15/30-game windows (comparing that
      // window's OPS to season OPS) — Season has nothing to compare itself
      // to, so no gauge there.
      const heat = (win==="d7"||win==="d15"||win==="d30") ? line.heat : null;
      const gaugeHtml = heat ? heatGaugeHtml(heat, line.ops, d.season?.ops) : "";
      body=`${gaugeHtml}<div class="row" style="margin-bottom:14px;">
        ${statBlock("AVG",fmt3(line.avg),true)}${statBlock("HR",line.hr,true)}
        ${statBlock("RBI",line.rbi,true)}${statBlock("OPS",fmt3(line.ops),true,"var(--accent)")}</div>
        <div class="row" style="border-top:1px solid var(--line);padding-top:12px;">
        ${statBlock("G",line.games,false,grey)}${statBlock("AB",line.ab,false,grey)}${statBlock("R",line.r,false,grey)}
        ${statBlock("H",line.h,false,grey)}${statBlock("OBP",fmt3(line.obp),false,grey)}
        ${statBlock("SLG",fmt3(line.slg),false,grey)}</div>`;
    }
  }
  const il = d && d.il;
  const ilBadge = il ? `<span class="mono" style="display:inline-flex;align-items:center;gap:5px;margin-left:9px;font-size:9.5px;font-weight:700;color:#c24444;background:#fbe9e9;border-radius:4px;padding:2px 7px;vertical-align:middle;">${esc(il.label)}</span>` : "";
  const superHeat = d && d.superHeat;
  // The circle is a BLENDED number across all three windows — showing it
  // alongside the 7/15/30 tabs' own single-window gauge created confusing
  // contradictions (e.g. circle reads cold while that window's own label
  // reads Steady or Hot, since they're describing different timeframes).
  // Season is its original home — "the overall picture across all three
  // windows" is exactly what's wanted there, with no competing indicator
  // on the card. Kept off Today too, so it only ever appears in the one
  // place it was designed for.
  const showScoreCircle = win==="season";
  const heatScore = (showScoreCircle && d && typeof d.heatScore==="number") ? d.heatScore : null;
  const nameHtml = heatNameHtml(p.name, superHeat, heatScore);
  return `<div class="pcard${isPrev?" prev":""}" draggable="true" data-pid="${p.id}">
    <button class="pmove-btn" data-pmove="${p.id}" aria-label="Move player">⋮</button>
    <button class="x" data-rm="${p.id}" aria-label="Remove">×</button>
    <div style="margin-bottom:14px;">
      <div class="disp" style="font-size:17px;color:var(--text);">${nameHtml}${ilBadge}</div>
      <div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px;">${esc(p.pos||"")}${p.team?" · "+esc(p.team):""}${(d && d.level && d.level!=="MLB")?` · ${esc(d.level)}`:""}</div>
    </div>
    ${body}
  </div>`;
}

// Small always-visible circle showing the 0-10 Heat Meter Score, colored
// warm/cool/neutral. Shows on every tab (not just Season/splits), since the
// score itself is a fact about the player, same reasoning as the superHeat
// badge — it shouldn't require clicking into a specific tab to see.
function heatScoreCircleHtml(score){
  if(score==null) return "";
  const c = score>6.25 ? {border:"#e0824a", text:"#c2571f"}
          : score<3.75 ? {border:"#4a8fe0", text:"#2f6fd8"}
          : {border:"#d8dde6", text:"#6b7789"};
  return `<span class="heat-score-circle" style="width:27px;height:27px;border-radius:50%;border:1.5px solid ${c.border};display:inline-flex;align-items:center;justify-content:center;margin-left:9px;vertical-align:middle;flex-shrink:0;" title="Heat Meter Score: ${score.toFixed(1)} / 10">
    <span style="font-weight:800;font-size:11px;color:${c.text};">${score.toFixed(1)}</span>
  </span>`;
}

// Renders the player name plain, or — when superHeat is "hot"/"cold" — as
// individually-animatable letters wrapped so hovering the name ignites it
// (warm flicker + glow) or freezes it (icy shiver + glow), with a small
// icon and a "Blazing Hot"/"Ice Cold" label that reveals alongside it. The
// Heat Meter Score circle sits next to the name either way.
function heatNameHtml(name, superHeat, heatScore){
  const scoreHtml = heatScoreCircleHtml(heatScore);
  return `${esc(name)}${scoreHtml}`;
}

function catActionsHtml(sec){

// ---- list view: same categories, players, and data — a table instead of
// cards. Today has no static box score that maps onto a table row (it's a
// live-updating game state), so list mode is only offered on Season/7/15/30.
const LIST_COLS = {
  season: [["avg","AVG"],["hr","HR"],["rbi","RBI"],["ops","OPS"],["heat","HEAT SCORE"]],
  d7:     [["avg","AVG"],["hr","HR"],["rbi","RBI"],["ops","OPS"],["trend","HEAT TREND"]],
  d15:    [["avg","AVG"],["hr","HR"],["rbi","RBI"],["ops","OPS"],["trend","HEAT TREND"]],
  d30:    [["avg","AVG"],["hr","HR"],["rbi","RBI"],["ops","OPS"],["trend","HEAT TREND"]],
};
// Trend dot colors match the heat gauge exactly — same five bands, same fills.
const TREND_DOT_COLORS = { cold:"#4a8fe0", cooling:"#a9c9f0", steady:"#d8dde6", heating:"#f0c9a0", hot:"#e0824a" };
function sectionListHtml(sec, list){
  const actions = catActionsHtml(sec);
  const cols = LIST_COLS[win] || LIST_COLS.season;
  const gridCols = `22px 2fr ${cols.map(()=>"0.8fr").join(" ")} 30px`;
  const header = `<div class="list-header" style="grid-template-columns:${gridCols};">
    <span></span>
    <span class="lh-cell" data-sortcol="name" data-catid="${sec.id}">PLAYER</span>
    ${cols.map(([key,label])=>`<span class="lh-cell" style="text-align:center;" data-sortcol="${key==="trend"?"heat":key}" data-catid="${sec.id}">${label}</span>`).join("")}
    <span></span>
  </div>`;
  const rows = list.length ? list.map(p=>{
    const line = lineFor(p);
    const d = dataById[p.id];
    const superHeat = d && d.superHeat;
    const heatScore = (win==="season" && d && typeof d.heatScore==="number") ? d.heatScore : null;
    const nameHtml = heatNameHtml(p.name, superHeat, null); // score circle stays Season-card-only, not duplicated here
    const isOpen = expandedRows.has(p.id);
    const cellsHtml = cols.map(([key])=>{
      if(key==="heat") return `<span style="text-align:center;font-weight:800;font-size:13px;color:${heatScore==null?"var(--faint)":(heatScore>6.25?"#c2571f":heatScore<3.75?"#2f6fd8":"var(--dim)")};">${heatScore==null?"—":heatScore.toFixed(1)}</span>`;
      if(key==="trend"){
        const heat = line && line.heat;
        if(!heat) return `<span style="text-align:center;color:var(--faint);">—</span>`;
        const fill = TREND_DOT_COLORS[heat.key] || TREND_DOT_COLORS.steady;
        return `<span style="text-align:center;"><span class="trend-dot" data-trendlabel="${esc(heat.label)}" title="${esc(heat.label)}"
          style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${fill};cursor:pointer;"></span></span>`;
      }
      const v = line ? line[key] : null;
      const display = (key==="avg"||key==="ops") ? fmt3(v) : (v==null?"—":v);
      return `<span style="text-align:center;font-weight:700;font-size:13px;color:${key==="ops"?"var(--accent)":"var(--text)"};">${display}</span>`;
    }).join("");
    const subHtml = isOpen && line ? `<div class="prow-sub">
      <div style="display:flex;gap:22px;">
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${line.games??"—"}</div><div style="font-size:7.5px;color:var(--faint);">G</div></div>
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${line.ab??"—"}</div><div style="font-size:7.5px;color:var(--faint);">AB</div></div>
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${line.r??"—"}</div><div style="font-size:7.5px;color:var(--faint);">R</div></div>
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${line.h??"—"}</div><div style="font-size:7.5px;color:var(--faint);">H</div></div>
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${fmt3(line.obp)}</div><div style="font-size:7.5px;color:var(--faint);">OBP</div></div>
        <div style="text-align:center;"><div style="font-weight:700;font-size:12px;color:#8a95a5;">${fmt3(line.slg)}</div><div style="font-size:7.5px;color:var(--faint);">SLG</div></div>
      </div>
    </div>` : "";
    return `<div class="prow pcard" draggable="true" data-pid="${p.id}" style="grid-template-columns:${gridCols};">
        <span class="prow-expand-arrow${isOpen?" open":""}" data-expand="${p.id}" title="Expand Stats">▸</span>
        <div><span style="font-weight:700;font-size:13.5px;color:var(--text);">${nameHtml}</span>
          <div style="font-size:9px;color:var(--faint);">${esc(p.pos||"")}${p.team?" · "+esc(p.team):""}</div></div>
        ${cellsHtml}
        <span style="text-align:right;position:relative;">
          <button class="pmove-btn" data-pmove="${p.id}" style="position:static;" aria-label="Move player">⋮</button>
        </span>
      </div>${subHtml}`;
  }).join("") : `<div class="empty-cat-hint">Drag players here</div>`;
  return `<div class="category-section" data-cat="${sec.id}">
    <div class="cat-header">
      <span class="disp" style="font-size:16px;">${esc(sec.name)}</span>
      <span class="cat-count mono">${list.length}</span>
      ${actions}
    </div>
    <div class="listgrid catgrid" data-cat="${sec.id}">${header}${rows}</div>
  </div>`;
}
function wireListInteractions(){
  document.querySelectorAll("[data-expand]").forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const pid = +el.dataset.expand;
      if(expandedRows.has(pid)) expandedRows.delete(pid); else expandedRows.add(pid);
      render();
    };
  });
  document.querySelectorAll("[data-sortcol]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.sortcol, catId = el.dataset.catid;
      if(key==="name") sortCategoryByName(catId); else sortCategory(catId, key);
    };
  });
  // Hover already shows the band via the native title tooltip on desktop —
  // that doesn't fire on tap, so a click also surfaces the same label via
  // the existing toast, giving touch users the same information.
  document.querySelectorAll(".trend-dot").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); showToast(el.dataset.trendlabel); };
  });
}
// Alphabetical A→Z — the one column where "highest to lowest" doesn't
// naturally apply, so this sorts by name instead of by number.
function sortCategoryByName(catId){
  const idxs = [];
  players.forEach((p,i)=>{ if(categoryOf(p)===catId) idxs.push(i); });
  if(idxs.length<2) return;
  const sortedGroup = idxs.map(i=>players[i]).sort((a,b)=> a.name.localeCompare(b.name));
  idxs.forEach((originalIdx,k)=>{ players[originalIdx] = sortedGroup[k]; });
  saveState();
  flipRender();
}

function render(){
  renderTabs();
  document.getElementById("empty").style.display = players.length?"none":"block";
  const container = document.getElementById("cards");

  // Today has no static box score that maps onto a table row, so list mode
  // only applies to Season/7/15/30 — force back to cards there automatically.
  const listAvailable = win!=="live";
  const toggle = document.getElementById("viewToggle");
  if(toggle) toggle.style.display = listAvailable ? "flex" : "none";
  const useList = viewMode==="list" && listAvailable;

  const sections = categories.map(c=>({ id:c.id, name:c.name, custom:true }));
  sections.push({ id:UNCAT, name:"Uncategorized", custom:false });

  container.innerHTML = sections.map(sec=>{
    const list = players.filter(p=>categoryOf(p)===sec.id);
    if(sec.id===UNCAT && list.length===0) return "";
    return useList ? sectionListHtml(sec, list) : sectionHtml(sec, list);
  }).join("");

  container.querySelectorAll("[data-rm]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); removePlayer(+b.dataset.rm); });
  wireDragDrop();
  wireTouchDrag();
  wirePlayerMoveMenus();
  wireCategoryMenus();
  wireCategorySort();
  if(useList) wireListInteractions();
}

// ---- drag and drop (within + across categories) ----
function reorder(dragId, targetId, before, targetCatId){
  const from=players.findIndex(p=>p.id===dragId);
  if(from<0) return;
  const [moved]=players.splice(from,1);
  moved.categoryId = (targetCatId===UNCAT) ? null : targetCatId;
  if(targetId==null){
    players.push(moved);
  } else {
    let to=players.findIndex(p=>p.id===targetId);
    if(to<0){ players.push(moved); }
    else { if(!before) to+=1; players.splice(to,0,moved); }
  }
  saveState();
  flipRender();
}

// FLIP animation: record positions, re-render, animate cards AND sections from old→new spot.
function flipRender(){
  const c=document.getElementById("cards");
  const first=new Map();
  c.querySelectorAll(".pcard").forEach(el=> first.set("p:"+el.dataset.pid, el.getBoundingClientRect()));
  c.querySelectorAll(".category-section").forEach(el=> first.set("c:"+el.dataset.cat, el.getBoundingClientRect()));
  render();
  const last=new Map();
  c.querySelectorAll(".pcard").forEach(el=> last.set("p:"+el.dataset.pid, el.getBoundingClientRect()));
  c.querySelectorAll(".category-section").forEach(el=> last.set("c:"+el.dataset.cat, el.getBoundingClientRect()));
  function animate(el, key){
    const f=first.get(key), l=last.get(key);
    if(!f||!l) return;
    const dx=f.left-l.left, dy=f.top-l.top;
    if(dx===0&&dy===0) return;
    el.style.transform=`translate(${dx}px,${dy}px)`;
    el.style.transition="none";
    requestAnimationFrame(()=>{
      el.style.transition="transform .28s cubic-bezier(.2,.7,.3,1)";
      el.style.transform="";
    });
  }
  c.querySelectorAll(".pcard").forEach(el=> animate(el, "p:"+el.dataset.pid));
  c.querySelectorAll(".category-section").forEach(el=> animate(el, "c:"+el.dataset.cat));
}

function wireDragDrop(){
  document.querySelectorAll(".pcard").forEach(card=>{
    card.addEventListener("dragstart",e=>{ dragPid=+card.dataset.pid; card.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    card.addEventListener("dragend",()=>{ card.classList.remove("dragging"); dragPid=null; clearDropCues(); });
  });
  document.querySelectorAll(".catgrid").forEach(grid=>{
    grid.addEventListener("dragover", e=>{
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      if(dragPid==null) return;
      clearDropCues();
      const card = e.target.closest(".pcard");
      if(card && +card.dataset.pid !== dragPid){
        const r=card.getBoundingClientRect();
        const before = (e.clientX - r.left) < r.width/2;
        card.classList.add(before?"drop-before":"drop-after");
      } else {
        const sec = grid.closest(".category-section");
        if(sec) sec.classList.add("cat-droptarget");
      }
    });
    grid.addEventListener("dragleave", e=>{
      if(!grid.contains(e.relatedTarget)){
        const sec = grid.closest(".category-section");
        if(sec) sec.classList.remove("cat-droptarget");
      }
    });
    grid.addEventListener("drop", e=>{
      e.preventDefault();
      if(dragPid==null){ clearDropCues(); return; }
      const catId = grid.dataset.cat;
      const card = e.target.closest(".pcard");
      clearDropCues();
      if(card && +card.dataset.pid !== dragPid){
        const r=card.getBoundingClientRect();
        const before = (e.clientX - r.left) < r.width/2;
        reorder(dragPid, +card.dataset.pid, before, catId);
      } else {
        reorder(dragPid, null, true, catId);
      }
    });
  });
}
function clearDropCues(){
  document.querySelectorAll(".pcard.drop-before,.pcard.drop-after")
    .forEach(el=> el.classList.remove("drop-before","drop-after"));
  document.querySelectorAll(".category-section.cat-droptarget")
    .forEach(el=> el.classList.remove("cat-droptarget"));
}

// ---- touch-based drag for mobile (iPhone/Android) ----
// The HTML5 drag API used above (dragstart/dragover/drop) is mouse-only —
// touchscreens never fire those events at all, which is why dragging didn't
// work on phones. This runs as a completely separate path that only listens
// for touch events, and funnels into the exact same reorder() function the
// desktop version already uses — the actual reordering logic is untouched,
// only the gesture-detection is new. A mouse drag never fires touch events
// and vice versa, so the two systems can't step on each other.
//
// A long-press (300ms, holding still) arms the drag, so an ordinary scroll
// or tap through a card isn't mistaken for a drag attempt — the same pattern
// iOS itself uses for rearranging home-screen icons.
let touchDrag = null;
const TOUCH_HOLD_MS = 300;
const TOUCH_CANCEL_PX = 10;

function wireTouchDrag(){
  document.querySelectorAll(".pcard").forEach(card=>{
    card.addEventListener("touchstart", (e)=>{
      if(e.touches.length!==1) return; // ignore pinch/multi-touch
      const t = e.touches[0];
      const pid = +card.dataset.pid;
      const state = { pid, card, startX:t.clientX, startY:t.clientY, armed:false, moved:false,
        dropTargetId:null, dropBefore:true, dropCatId:null };
      state.timer = setTimeout(()=>{
        if(touchDrag!==state) return;
        state.armed = true;
        dragPid = pid;
        card.classList.add("dragging","touch-dragging");
        if(navigator.vibrate) navigator.vibrate(8);
      }, TOUCH_HOLD_MS);
      touchDrag = state;
    }, { passive:true });

    card.addEventListener("touchmove", (e)=>{
      if(!touchDrag || touchDrag.pid !== +card.dataset.pid) return;
      const t = e.touches[0];
      if(!touchDrag.armed){
        const dx=t.clientX-touchDrag.startX, dy=t.clientY-touchDrag.startY;
        if(Math.hypot(dx,dy) > TOUCH_CANCEL_PX){
          clearTimeout(touchDrag.timer);
          touchDrag = null; // treat as a scroll — let the page move normally
        }
        return;
      }
      e.preventDefault(); // only block scrolling once a drag is actually armed
      touchDrag.moved = true;
      clearDropCues();
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const targetCard = el && el.closest(".pcard");
      const targetGrid = el && el.closest(".catgrid");
      if(targetCard && +targetCard.dataset.pid !== touchDrag.pid){
        const r = targetCard.getBoundingClientRect();
        const before = (t.clientX - r.left) < r.width/2;
        targetCard.classList.add(before?"drop-before":"drop-after");
        touchDrag.dropTargetId = +targetCard.dataset.pid;
        touchDrag.dropBefore = before;
        touchDrag.dropCatId = targetCard.closest(".catgrid")?.dataset.cat;
      } else if(targetGrid){
        const sec = targetGrid.closest(".category-section");
        if(sec) sec.classList.add("cat-droptarget");
        touchDrag.dropTargetId = null;
        touchDrag.dropCatId = targetGrid.dataset.cat;
      }
      updateAutoScroll(t.clientY);
    }, { passive:false });

    function endTouch(){
      if(!touchDrag || touchDrag.pid !== +card.dataset.pid) return;
      clearTimeout(touchDrag.timer);
      if(touchDrag.armed && touchDrag.moved && touchDrag.dropCatId){
        reorder(touchDrag.pid, touchDrag.dropTargetId, touchDrag.dropBefore, touchDrag.dropCatId);
      }
      card.classList.remove("dragging","touch-dragging");
      clearDropCues();
      clearInterval(autoScrollTimer);
      dragPid = null;
      touchDrag = null;
    }
    card.addEventListener("touchend", endTouch);
    card.addEventListener("touchcancel", endTouch);
  });
}

// ---- drag a whole category (header + all its players) above/below others ----
// Uncategorized is never in the categories array, so it's never reordered —
// it always renders last.
function moveCategory(catId, dir){
  const idx = categories.findIndex(c=>c.id===catId);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=categories.length) return;
  [categories[idx], categories[newIdx]] = [categories[newIdx], categories[idx]];
  saveState();
  flipRender();
}

// ---- per-card move menu: step within a category, or jump straight to any
// category without dragging. Built entirely on click handlers, so it needs
// no special handling to work on mobile — unlike drag, a tap is a tap on
// every device already.
function movePlayerStep(pid, dir){
  const player = players.find(p=>p.id===pid);
  if(!player) return;
  const catId = categoryOf(player);
  const idxs = [];
  players.forEach((p,i)=>{ if(categoryOf(p)===catId) idxs.push(i); });
  const posInCat = idxs.findIndex(i=>players[i].id===pid);
  const swapPos = posInCat + dir;
  if(swapPos<0 || swapPos>=idxs.length) return; // already at that edge of the category
  const idxA = idxs[posInCat], idxB = idxs[swapPos];
  [players[idxA], players[idxB]] = [players[idxB], players[idxA]];
  saveState();
  flipRender();
}

// A small fixed-position confirmation that lives outside #cards, so it
// survives the re-render a move triggers (a toast anchored to the card
// itself would vanish the instant the DOM rebuilds).
function showToast(msg){
  let toast = document.getElementById("globalToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "globalToast";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(()=>{ toast.style.opacity = "0"; }, 1400);
}

function closeAllPlayerMoveMenus(){ document.querySelectorAll(".pmove-dropdown").forEach(m=>m.remove()); }

function wirePlayerMoveMenus(){
  document.querySelectorAll(".pmove-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const already = btn.parentElement.querySelector(".pmove-dropdown");
      closeAllCatMenus(); closeAllPlayerMoveMenus();
      if(already) return; // clicking again just closes it
      renderPlayerMoveMenu(btn, +btn.dataset.pmove, "main");
    };
  });
}

function renderPlayerMoveMenu(btn, pid, view){
  const player = players.find(p=>p.id===pid);
  if(!player) return;
  const catId = categoryOf(player);
  const idxs = [];
  players.forEach((p,i)=>{ if(categoryOf(p)===catId) idxs.push(i); });
  const posInCat = idxs.findIndex(i=>players[i].id===pid);
  const isFirst = posInCat<=0, isLast = posInCat>=idxs.length-1;

  const menu = document.createElement("div");
  menu.className = "pmove-dropdown catmenu-dropdown";

  if(view==="main"){
    // Cards already have a dedicated × button with room to be safe from mis-taps.
    // List rows are much denser, so Remove folds into this menu instead of
    // adding a second always-visible icon next to a tight row of controls.
    const isListRow = !!btn.closest(".prow");
    menu.innerHTML = `
      <div class="catmenu-item${isFirst?" disabled":""}" data-act="earlier">↑ Move earlier</div>
      <div class="catmenu-item${isLast?" disabled":""}" data-act="later">↓ Move later</div>
      <div class="catmenu-item" data-act="tocat" style="display:flex;justify-content:space-between;">Move to category <span style="color:var(--faint);">▸</span></div>
      ${isListRow ? `<div class="catmenu-item" data-act="remove" style="color:#c24444;font-weight:600;border-top:1px solid var(--panel2);">Remove</div>` : ""}`;
    if(!isFirst) menu.querySelector('[data-act="earlier"]').onclick = (ev)=>{
      ev.stopPropagation(); closeAllPlayerMoveMenus(); movePlayerStep(pid,-1);
    };
    if(!isLast) menu.querySelector('[data-act="later"]').onclick = (ev)=>{
      ev.stopPropagation(); closeAllPlayerMoveMenus(); movePlayerStep(pid,1);
    };
    menu.querySelector('[data-act="tocat"]').onclick = (ev)=>{
      ev.stopPropagation(); menu.remove(); renderPlayerMoveMenu(btn, pid, "category");
    };
    if(isListRow) menu.querySelector('[data-act="remove"]').onclick = (ev)=>{
      ev.stopPropagation(); closeAllPlayerMoveMenus(); removePlayer(pid);
    };
  } else {
    const allCats = [...categories.map(c=>({id:c.id,name:c.name})), {id:UNCAT,name:"Uncategorized"}];
    menu.innerHTML = `<div class="pmove-back" data-act="back">‹ Back</div>` +
      allCats.map(c=>`<div class="catmenu-item" data-catid="${esc(c.id)}" style="display:flex;justify-content:space-between;">${esc(c.name)}${c.id===catId?'<span class="pmove-check">✓</span>':''}</div>`).join("");
    menu.querySelector('[data-act="back"]').onclick = (ev)=>{
      ev.stopPropagation(); menu.remove(); renderPlayerMoveMenu(btn, pid, "main");
    };
    menu.querySelectorAll("[data-catid]").forEach(item=>{
      item.onclick = (ev)=>{
        ev.stopPropagation();
        const targetCatId = item.dataset.catid;
        closeAllPlayerMoveMenus();
        if(targetCatId===catId) return; // already there
        const catName = allCats.find(c=>c.id===targetCatId)?.name || "";
        reorder(pid, null, true, targetCatId);
        showToast(`Moved to ${catName}`);
      };
    });
  }
  btn.parentElement.appendChild(menu);
}

// ---- sort a category's players by AVG / HR / RBI / OPS / Hot-to-Cold ----
// Uses whichever stat window is currently active (Season, 7 Games, etc.) so the
// sort matches what's on screen. Reorders players in place within the category —
// you can still drag to fine-tune afterward, same as any other manual order.
// "heat" sorts by the same delta (window OPS minus season OPS) that drives the
// heat gauge, but with Blazing Hot players clustered together at the very top
// and Ice Cold players clustered together at the very bottom — the badge is a
// stronger, multi-window-confirmed signal, so it should outrank a merely-high
// single-window delta rather than just being sorted in among everyone else.
// Players with no heat reading (too few games, or a tab where heat doesn't
// apply) still sink below even the Ice Cold cluster, same as before.
function sortCategory(catId, stat){
  const idxs = [];
  players.forEach((p,i)=>{ if(categoryOf(p)===catId) idxs.push(i); });
  if(idxs.length<2) return;
  const valueOf = (p) => {
    const line = lineFor(p);
    if(stat==="heat"){
      // Season has no per-window delta to sort by (nothing to compare season
      // to) — use the blended Heat Meter Score instead, same 0-10 number
      // shown on the card there. Splits tabs keep using that window's own
      // delta, which is what actually matches their gauge on screen.
      const superHeat = dataById[p.id]?.superHeat;
      if(win==="season"){
        const score = dataById[p.id]?.heatScore;
        if(typeof score!=="number" || isNaN(score)) return -Infinity;
        if(superHeat==="hot") return 2000 + score;
        if(superHeat==="cold") return -2000 + score;
        return score;
      }
      if(!line) return -Infinity;
      const delta = line.heat?.delta;
      if(typeof delta!=="number" || isNaN(delta)) return -Infinity; // no data — always last
      if(superHeat==="hot") return 2000 + delta;   // Blazing Hot tier — always first
      if(superHeat==="cold") return -2000 + delta; // Ice Cold tier — always last (above no-data)
      return delta;                                 // everyone else, sorted normally in between
    }
    if(!line) return -Infinity;
    const v = line[stat];
    return (typeof v==="number" && !isNaN(v)) ? v : -Infinity;
  };
  const sortedGroup = idxs.map(i=>players[i]).sort((a,b)=> valueOf(b)-valueOf(a));
  idxs.forEach((originalIdx,k)=>{ players[originalIdx] = sortedGroup[k]; });
  saveState();
  flipRender();
}

// ---- category create / rename / delete ----
function newCatId(){ return "cat_" + Date.now() + "_" + Math.floor(Math.random()*1000); }

function resetAddCatRow(){
  const row = document.getElementById("addCatRow");
  row.innerHTML = `<button id="addCatBtn" class="addcat-chip"><span style="font-size:15px;">+</span> Add Category</button>`;
  document.getElementById("addCatBtn").onclick = startAddCategory;
}
function startAddCategory(){
  const row = document.getElementById("addCatRow");
  row.innerHTML = `<input id="newCatInput" placeholder="Category name" autocomplete="off" />`;
  const inp = document.getElementById("newCatInput");
  inp.focus();
  let done=false;
  function commit(){
    if(done) return; done=true;
    const name = inp.value.trim();
    if(name){ categories.push({ id:newCatId(), name }); saveState(); render(); }
    resetAddCatRow();
  }
  inp.addEventListener("keydown", e=>{
    if(e.key==="Enter") commit();
    else if(e.key==="Escape"){ done=true; resetAddCatRow(); }
  });
  inp.addEventListener("blur", commit);
}
resetAddCatRow();

function closeAllCatMenus(){ document.querySelectorAll(".catmenu-dropdown").forEach(m=>m.remove()); }

function wireCategoryMenus(){
  document.querySelectorAll(".cat-edit-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const already = btn.parentElement.querySelector(".catmenu-dropdown");
      closeAllCatMenus();
      if(already) return; // clicking again just closes it
      const catId = btn.dataset.catid;
      const idx = categories.findIndex(c=>c.id===catId);
      const isFirst = idx<=0;
      const isLast = idx>=categories.length-1;
      const menu = document.createElement("div");
      menu.className = "catmenu-dropdown";
      menu.innerHTML = `
        <div class="catmenu-item${isFirst?" disabled":""}" data-act="up">↑ Move up</div>
        <div class="catmenu-item${isLast?" disabled":""}" data-act="down">↓ Move down</div>
        <div class="catmenu-divider"></div>
        <div class="catmenu-item" data-act="rename">Rename</div>
        <div class="catmenu-item danger" data-act="delete">Delete</div>`;
      btn.parentElement.appendChild(menu);

      if(!isFirst) menu.querySelector('[data-act="up"]').onclick = (ev)=>{
        ev.stopPropagation(); closeAllCatMenus(); moveCategory(catId, -1);
      };
      if(!isLast) menu.querySelector('[data-act="down"]').onclick = (ev)=>{
        ev.stopPropagation(); closeAllCatMenus(); moveCategory(catId, 1);
      };
      menu.querySelector('[data-act="rename"]').onclick = (ev)=>{
        ev.stopPropagation();
        const cat = categories.find(c=>c.id===catId);
        if(!cat) return;
        const name = prompt("Rename category:", cat.name);
        if(name && name.trim()){ cat.name = name.trim(); saveState(); render(); }
        else closeAllCatMenus();
      };
      menu.querySelector('[data-act="delete"]').onclick = (ev)=>{
        ev.stopPropagation();
        const cat = categories.find(c=>c.id===catId);
        if(!cat) return;
        if(confirm(`Delete "${cat.name}"? Players inside will move to Uncategorized.`)){
          categories = categories.filter(c=>c.id!==catId);
          players.forEach(p=>{ if(p.categoryId===catId) p.categoryId=null; });
          saveState(); render();
        } else closeAllCatMenus();
      };
    };
  });
}

function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtGameDate(d){
  if(!d) return "";
  const parts=String(d).split("-");
  if(parts.length!==3) return d;
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mo=months[(+parts[1])-1]||"";
  return mo+" "+(+parts[2]);
}

// ---- auto-scroll the page while dragging a card or category near the edges ----
// A large trigger zone means the page starts scrolling well before the cursor
// gets anywhere near the very top of the viewport — so you never need to chase
// the edge, which is what was sending fast drags up into the browser's own tabs.
// Shared by both mouse drag (dragover, below) and touch drag (touchmove) so
// they can't ever drift out of sync with each other.
let autoScrollTimer=null;
function updateAutoScroll(clientY){
  if(dragPid==null){ clearInterval(autoScrollTimer); return; }
  const edge=180, vh=window.innerHeight;
  const distTop=clientY, distBottom=vh-clientY;
  clearInterval(autoScrollTimer);
  if(distTop<edge){
    const speed=(edge-distTop)/edge;
    autoScrollTimer=setInterval(()=>{ window.scrollBy(0, -(4*speed+1)); }, 16);
  } else if(distBottom<edge){
    const speed=(edge-distBottom)/edge;
    autoScrollTimer=setInterval(()=>{ window.scrollBy(0, 4*speed+1); }, 16);
  }
}
document.addEventListener("dragover", e=> updateAutoScroll(e.clientY));
document.addEventListener("drop", ()=> clearInterval(autoScrollTimer));
document.addEventListener("dragend", ()=> clearInterval(autoScrollTimer));


// ---- boot: if synced, load from the server; otherwise restore from local
// storage (with legacy migration) exactly as before, then hydrate ----
(async function(){
  render();

  if(syncCode){
    try{
      const result = await loadFromServerByCode(syncCode);
      if(result.notFound){
        // The code no longer exists server-side — clear it rather than keep
        // failing silently every reload, and fall through to local data.
        clearSyncCode();
      } else {
        await applyLoadedData(result.data);
        updateSyncBadge();
        return; // synced boot complete — skip the local-storage path entirely
      }
    }catch(e){
      // Network/server issue — the code may still be perfectly valid, just
      // unreachable right now. Don't clear it; fall back to local data as a
      // safe offline default, and it'll sync again next time it's reachable.
      console.log("[sync] couldn't reach the server, using local data for now");
    }
  }

  try{ categories = JSON.parse(localStorage.getItem(LS_CATS)||"[]"); }catch(e){ categories=[]; }

  let saved=null;
  try{ saved = JSON.parse(localStorage.getItem(LS_PLAYERS)||"null"); }catch(e){ saved=null; }
  if(!saved){
    // migrate from the old flat id-list format
    try{
      const oldIds = JSON.parse(localStorage.getItem(LS_KEY_OLD)||"[]");
      saved = oldIds.map(id=>({ id, categoryId:null }));
    }catch(e){ saved=[]; }
  }

  for(const rec of saved){
    try{
      const prof=await api(`/api/profile/${rec.id}`);
      prof.categoryId = rec.categoryId || null;
      players.push(prof);
    }catch(e){ players.push({ id:rec.id, name:"#"+rec.id, team:"", pos:"", categoryId:rec.categoryId||null }); }
  }
  saveState(); // write in the new format going forward
  render();

  let anyFailed = false;
  for(const p of players){
    try{ dataById[p.id]=await api(`/api/player/${p.id}`); render(); }catch(e){ anyFailed = true; }
  }
  lastUpdated = Date.now();
  if(players.length) setApiStatus(!anyFailed);
  renderTabs();
  updateSyncBadge();
})();
</script>
